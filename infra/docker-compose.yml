# Production Docker Compose Configuration

# Rotasi log supaya disk tidak penuh oleh json-file
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Application Services
  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: after-sales-backend
    restart: unless-stopped
    env_file:
      - ../../config/.env.backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: after-sales-frontend
    restart: unless-stopped
    env_file:
      - ../../config/.env.frontend
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

  # Infrastructure Services
  rabbitmq:
    image: rabbitmq:4-management
    container_name: after-sales-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # AMQP Message Broker
      - "127.0.0.1:15672:15672" # Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    logging: *default-logging

  rustfs-permissions:
    image: busybox:1.36
    command: sh -c "mkdir -p /data /logs && chown -R 10001:10001 /data /logs"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: after-sales-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    secrets:
      - rustfs_password
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_password
    ports:
      - "127.0.0.1:9000:9000" # S3 API Endpoint
      - "127.0.0.1:9001:9001" # Web Console
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      - app-network
    mem_limit: 512m
    logging: *default-logging

  # Cache dashboard (opsional): tanpa Redis, query dihitung ulang setiap request
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *default-logging

# Network & Storage Definitions
networks:
  app-network:
    driver: bridge

volumes:
  rabbitmq_data:
  rustfs_data:
  rustfs_logs:
  redis_data:

secrets:
  redis_password:
    file: ../../config/redis_pw.txt
  rustfs_password:
    file: ../../config/rustfs_pw.txt
