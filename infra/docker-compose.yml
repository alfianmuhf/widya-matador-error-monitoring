services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: after-sales-backend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
    container_name: after-sales-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Event bus: error-service → RabbitMQ → n8n → Telegram
  rabbitmq:
    image: rabbitmq:4-management
    container_name: after-sales-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP (dipakai backend)
      - "15672:15672"  # Management dashboard (user: guest, pass: guest)
