services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: after-sales-backend
    restart: unless-stopped
    env_file:
      - ../../config/.env.backend
    network_mode: host
    depends_on:
      - rabbitmq
      - redis

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: after-sales-frontend
    restart: unless-stopped
    env_file:
      - ../../config/.env.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Event bus: error-service → RabbitMQ → n8n → Telegram
  rabbitmq:
    image: rabbitmq:4-management
    container_name: after-sales-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP (dipakai backend)
      - "15672:15672"  # Management dashboard (user: guest, pass: guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Object storage lampiran tiket (S3-compatible).
  # Container RustFS jalan sebagai UID 10001, jadi named volume harus di-chown sekali.
  rustfs-permissions:
    image: busybox:1.36
    command: sh -c "mkdir -p /data /logs && chown -R 10001:10001 /data /logs"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

  # Backend sengaja TIDAK depends_on rustfs: tanpa storage, tiket tetap jalan
  # dan endpoint lampiran mengembalikan 503.
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: after-sales-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    secrets:
      - rustfs_password
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_password
    ports:
      - "9000:9000"  # S3 API — harus bisa dijangkau backend
      - "9001:9001"  # Console
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

  # In-memory Cache & Session Store
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  rustfs_data:
  rustfs_logs:
  redis_data:

secrets:
  redis_password:
    file: ../../config/redis_pw.txt
  rustfs_password:
    file: ../../config/rustfs_pw.txt
