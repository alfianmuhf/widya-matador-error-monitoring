services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: after-sales-backend
    restart: unless-stopped
    env_file:
      - ../../env-file/.env.backend
    network_mode: host
    depends_on:
      - rabbitmq

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: after-sales-frontend
    restart: unless-stopped
    env_file:
      - ../../env-file/.env.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Event bus: error-service → RabbitMQ → n8n → Telegram
  rabbitmq:
    image: rabbitmq:4-management
    container_name: after-sales-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP (dipakai backend)
      - "15672:15672"  # Management dashboard (user: guest, pass: guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
