# Nginx Host Configuration (Reverse Proxy & Static Web Server)

server {
    listen 5173;
    server_name _;

    # Root direktori file statis hasil build frontend React
    root /var/www/after-sales;
    index index.html;

    client_max_body_size 550M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Melayani Static Files React (Mendukung React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Cache untuk aset statis Vite (JS, CSS, media)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3. Backend Proxy (Forward ke Express API container Docker port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pengaturan SSE (Non-buffering)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
