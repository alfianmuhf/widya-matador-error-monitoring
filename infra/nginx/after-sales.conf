# ==============================================================================
# Konfigurasi Nginx untuk Server Host (Reverse Proxy)
# Lokasi di Server Host: /etc/nginx/sites-available/after-sales.conf
# (Lalu buat symlink ke /etc/nginx/sites-enabled/ dan reload nginx)
# ==============================================================================

server {
    listen 80;
    server_name _; # Ganti dengan domain Anda (contoh: app.domainanda.com) atau biarkan _ untuk IP server

    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # 1. Frontend Web App (Reverse Proxy ke Container after-sales-frontend)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # 2. Backend REST API & Real-time SSE (Reverse Proxy ke after-sales-backend)
    # --------------------------------------------------------------------------
    location /api/ {
        # Meneruskan request /api/... ke container backend port 3000
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pengaturan khusus Server-Sent Events (SSE) agar real-time stream tidak macet/buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
